[package]
name = "serialweb-server"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "SerialWeb remote serial server"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
